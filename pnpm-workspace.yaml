  'brace-expansion@>=5.0.0 <5.0.9': 5.0.9
  'esbuild@>=0.28.0 <0.28.2': 0.28.2
  'linkify-it@>=5.0.0 <5.0.2': 5.0.2
  'vite@>=8.0.0 <8.0.16': 8.0.16
savePrefix: ''
strictDepBuilds: true
strictPeerDependencies: true
trustPolicy: no-downgrade

packages:
  - .

allowBuilds:
  esbuild@0.28.2: true

blockExoticSubdeps: true
frozenLockfile: true
minimumReleaseAge: 10080
packageManagerStrictVersion: true
# Security fixes for runtime and development-tool dependencies whose lock entries remain stale.
overrides:
  'ast-v8-to-istanbul@<1.0.5': 1.0.5
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'esbuild@>=0.28.0 <0.28.2': 0.28.2
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'linkify-it@>=5.0.0 <5.0.2': 5.0.2
  'markdown-it@>=14.0.0 <14.3.1': 14.3.1
  'vite@>=8.0.0 <8.0.16': 8.0.16
savePrefix: ''
strictDepBuilds: true
strictPeerDependencies: true
trustPolicy: no-downgrade

name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC trusted publisher

jobs:
  publish:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning] v4 only caches when cache is set
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Check release identity
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.private || process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error('Release tag must match the public package version.');
          }
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          # Knip's raw transfer reserves 6 GiB, exceeding this runner's 5 GB limit.
          KNIP_DISABLE_RAW_TRANSFER: '1'
      - name: Pack and stage the verified artifact
        run: |
          release_dir="$(mktemp -d)"
          trap 'rm -rf "$release_dir"' EXIT
          pnpm pack --pack-destination "$release_dir"
          set -- "$release_dir"/*.tgz
          test "$#" -eq 1
          test -f "$1"
          npm stage publish "$1" --access public --allow-file=all

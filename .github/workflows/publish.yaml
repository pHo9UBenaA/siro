name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC trusted publisher

jobs:
  publish:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - name: Check release identity
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.private || process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error('Release tag must match the public package version.');
          }
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          # Knip's raw transfer reserves 6 GiB, exceeding this runner's 5 GB limit.
          KNIP_DISABLE_RAW_TRANSFER: '1'
      - name: Pack and verify the release artifact
        run: pnpm test:package --output "$RUNNER_TEMP/siro.tgz"
      - name: Stage the verified artifact
        run: npm stage publish "$RUNNER_TEMP/siro.tgz" --access public --allow-file=all

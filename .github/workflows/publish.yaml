name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
      artifactId: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          KNIP_DISABLE_RAW_TRANSFER: '1'
      - name: Pack and verify the release artifact
        run: pnpm test:package --output "$RUNNER_TEMP/siro.tgz"
      - name: Check packed release and record its digest
        id: digest
        run: |
          set -euo pipefail
          digest=$(node scripts/check-release.mjs "$RUNNER_TEMP/siro.tgz")
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: verified-release
          path: ${{ runner.temp }}/siro.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 5
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      # No checkout, repository scripts, install, build, consumer execution, or repack here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifactId }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Check digest, then stage the exact artifact
        env:
          ARTIFACT_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$RUNNER_TEMP/release/siro.tgz" | sha256sum --check --strict
          npm stage publish "$RUNNER_TEMP/release/siro.tgz" --access public --allow-file=all
